name: Build & Release

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # Parser ke tests — fail hue to APK banta hi nahi.
      - name: Run unit tests
        run: gradle testDebugUnitTest --no-daemon

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      # Version ab app ke versionName se aata hai, taki release tag aur APK ka
      # version hamesha match karein.
      - name: Read app version
        id: version
        run: |
          VERSION=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"(.*)".*/\1/')
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION-${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Prepare APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk \
            "dist/EV-${{ steps.version.outputs.tag }}-debug.apk"

      - name: Create release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: E.V ${{ steps.version.outputs.name }} (build ${{ github.run_number }})
          body: |
            Automated build from commit ${{ github.sha }}.

            App version: ${{ steps.version.outputs.name }}
            Unit tests: passed

            Debug-signed APK attached.
          files: dist/*.apk
